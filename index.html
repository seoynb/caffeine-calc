<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하루 카페인 섭취량 계산기</title>
  <style>
    /* 1. 기본 스타일링 */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }

    /* 2. 입력 폼 스타일 */
    .form-group {
      margin-bottom: 15px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
      font-size: 0.9rem;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    button:hover {
      background-color: #45a049;
    }

    /* 3. 섭취 목록 스타일 */
    .list-container {
      margin-top: 20px;
      border-top: 2px solid #eee;
      padding-top: 15px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      margin-top: 0;
    }

    /* 4. 요약 및 경고 창 */
    .summary-box {
      background-color: #eef7ff;
      border-left: 5px solid #2196F3;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
    }
    .alert-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      display: none;
    }
    .alert-safe {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .alert-warning {
      background-color: #ffebee;
      color: #c62828;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>☕ 하루 카페인 섭취량 계산기</h1>

    <!-- 사용자 정보 입력 (나이 & 몸무게) -->
    <div class="form-row">
      <div class="form-group">
        <label for="user-age">나이 (세):</label>
        <input type="number" id="user-age" placeholder="예: 17" value="17" min="1" max="120">
      </div>
      <div class="form-group">
        <label for="user-weight">몸무게 (kg):</label>
        <input type="number" id="user-weight" placeholder="예: 60" value="60" min="1">
      </div>
    </div>

    <!-- 음료 선택 Form -->
    <div class="form-group">
      <label for="drink-select">음료 선택:</label>
      <select id="drink-select"></select>
    </div>

    <!-- 수량 입력 -->
    <div class="form-group">
      <label for="drink-count">수량 (개/잔):</label>
      <input type="number" id="drink-count" value="1" min="1">
    </div>

    <button id="add-btn">목록에 추가하기</button>

    <!-- 오늘 마신 음료 리스트 -->
    <div class="list-container">
      <h3>오늘 마신 음료 목록</h3>
      <ul id="intake-list"></ul>
    </div>

    <!-- 계산 결과 출력 영역 -->
    <div class="summary-box">
      <div>총 카페인 섭취량: <strong id="total-caffeine">0</strong> mg</div>
      <div style="font-size: 0.85rem; color: #666; margin-top: 6px;" id="user-type-info">
        적용 기준: <span id="target-group" style="font-weight: bold; color: #2196F3;">청소년 기준</span> 
        (권장 상한선: <span id="max-caffeine-limit">150</span>mg)
      </div>
    </div>

    <!-- 경고/안전 상태 메시지 -->
    <div id="alert-message" class="alert-box"></div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // [1] 음료 데이터베이스
    // -----------------------------------------------------------------
    const drinkDatabase = [
      { name: "아메리카노 (프랜차이즈 1잔)", caffeine: 150 },
      { name: "에스프레소 (1샷)", caffeine: 75 },
      { name: "카페라떼 / 카푸치노", caffeine: 75 },
      { name: "몬스터 에너지 (500ml)", caffeine: 100 },
      { name: "핫식스 (250ml)", caffeine: 60 },
      { name: "레드불 (250ml)", caffeine: 62.5 },
      { name: "스누피 더블샷 초코우유 (500ml)", caffeine: 237 },
      { name: "캔커피 (레쓰비 등 175ml)", caffeine: 70 },
      { name: "콜라 (355ml 캔)", caffeine: 35 },
      { name: "녹차 / 홍차 (티백 1잔)", caffeine: 30 }
    ];

    let userIntakeList = [];

    // DOM 요소 가져오기
    const ageInput = document.getElementById('user-age');
    const weightInput = document.getElementById('user-weight');
    const drinkSelect = document.getElementById('drink-select');
    const drinkCountInput = document.getElementById('drink-count');
    const addBtn = document.getElementById('add-btn');
    const intakeListUI = document.getElementById('intake-list');
    const totalCaffeineUI = document.getElementById('total-caffeine');
    const targetGroupUI = document.getElementById('target-group');
    const maxLimitUI = document.getElementById('max-caffeine-limit');
    const alertBox = document.getElementById('alert-message');

    // -----------------------------------------------------------------
    // [2] 초기화: 음료 셀렉트 박스 채우기
    // -----------------------------------------------------------------
    function initSelectOptions() {
      drinkDatabase.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${item.name} (${item.caffeine}mg)`;
        drinkSelect.appendChild(option);
      });
    }

    // -----------------------------------------------------------------
    // [3] 나이에 따른 카페인 권장량 계산 함수 (식약처 기준)
    // -----------------------------------------------------------------
    function calculateMaxLimit(age, weight) {
      // 만 19세 이상: 성인 (최대 400mg)
      if (age >= 19) {
        return { group: "성인 기준", limit: 400 };
      } 
      // 만 19세 미만: 청소년/어린이 (체중 1kg당 2.5mg)
      else {
        const calculatedLimit = Math.round(weight * 2.5);
        return { group: "청소년/어린이 기준", limit: calculatedLimit };
      }
    }

    // -----------------------------------------------------------------
    // [4] 화면 업데이트 함수 (핵심 로직)
    // -----------------------------------------------------------------
    function updateUI() {
      // 1. 총 섭취 카페인 계산
      const totalCaffeine = userIntakeList.reduce((sum, item) => sum + item.totalCaffeine, 0);
      totalCaffeineUI.textContent = totalCaffeine;

      // 2. 나이와 몸무게 값 가져와서 기준 계산
      const age = parseInt(ageInput.value) || 17;
      const weight = parseFloat(weightInput.value) || 60;
      const { group, limit } = calculateMaxLimit(age, weight);

      targetGroupUI.textContent = group;
      maxLimitUI.textContent = limit;

      // 3. 음료 목록 UI 출력
      intakeListUI.innerHTML = '';
      userIntakeList.forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${item.name} x ${item.count}개 (${item.totalCaffeine}mg)</span>
          <button class="delete-btn" onclick="deleteItem(${index})">삭제</button>
        `;
        intakeListUI.appendChild(li);
      });

      // 4. 경고 문구 분기 처리
      if (totalCaffeine === 0) {
        alertBox.style.display = 'none';
      } else {
        alertBox.style.display = 'block';
        if (totalCaffeine > limit) {
          alertBox.className = 'alert-box alert-warning';
          alertBox.textContent = `⚠️ 하루 권장 기준량(${limit}mg)을 초과했습니다! 카페인 섭취를 조절하세요.`;
        } else {
          alertBox.className = 'alert-box alert-safe';
          alertBox.textContent = `✅ 안전 범주 안입니다. (상한선까지 ${limit - totalCaffeine}mg 남음)`;
        }
      }
    }

    // -----------------------------------------------------------------
    // [5] 이벤트 리스너 설정
    // -----------------------------------------------------------------
    addBtn.addEventListener('click', () => {
      const selectedIndex = drinkSelect.value;
      const count = parseInt(drinkCountInput.value) || 1;
      const selectedDrink = drinkDatabase[selectedIndex];

      userIntakeList.push({
        name: selectedDrink.name,
        count: count,
        totalCaffeine: selectedDrink.caffeine * count
      });

      updateUI();
    });

    function deleteItem(index) {
      userIntakeList.splice(index, 1);
      updateUI();
    }

    // 나이나 몸무게를 수정하면 실시간으로 권장 기준과 경고문구가 변경됨
    ageInput.addEventListener('input', updateUI);
    weightInput.addEventListener('input', updateUI);

    // 프로그램 실행 시 최초 작동
    initSelectOptions();
    updateUI();
  </script>
</body>
</html>
